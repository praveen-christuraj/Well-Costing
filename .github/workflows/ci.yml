name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drilling_costing
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: drilling_costing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drilling_costing -d drilling_costing_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://drilling_costing:test_password@localhost:5432/drilling_costing_test
      SECRET_KEY: ci-only-test-secret-key-at-least-32-characters
      CORS_ORIGINS: '["http://localhost:3000"]'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: >-
          python -m venv .venv &&
          .venv/bin/python -m pip install --upgrade pip &&
          .venv/bin/pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Type check
        run: .venv/bin/pyright
      - name: Verify migrations round-trip
        run: .venv/bin/alembic upgrade head && .venv/bin/alembic downgrade base && .venv/bin/alembic upgrade head
      - name: Test
        run: .venv/bin/pytest --cov=app --cov-report=term-missing --cov-report=xml

  frontend:
    name: Frontend quality, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E smoke test
        run: npm run test:e2e

  full-stack-e2e:
    name: Full-stack Excel import E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drilling_costing
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: drilling_costing_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drilling_costing -d drilling_costing_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://drilling_costing:test_password@localhost:5432/drilling_costing_e2e
      SECRET_KEY: ci-e2e-only-secret-key-at-least-32-characters
      CORS_ORIGINS: '["http://localhost:3000"]'
      SEED_USER_EMAIL: e2e@example.com
      SEED_USER_PASSWORD: E2E-test-password-2026!
      E2E_FULL_STACK: "1"
      E2E_EMAIL: e2e@example.com
      E2E_PASSWORD: E2E-test-password-2026!
      NUXT_API_INTERNAL_BASE: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and migrate backend
        working-directory: backend
        run: >-
          python -m venv .venv &&
          .venv/bin/pip install -e ".[dev]" &&
          .venv/bin/alembic upgrade head &&
          .venv/bin/python scripts/seed_user.py
      - name: Start backend
        working-directory: backend
        run: nohup .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
      - name: Install and build frontend
        working-directory: frontend
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - name: Run full-stack E2E
        working-directory: frontend
        run: npm run test:e2e
