[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "drilling-costing-backend"
version = "0.1.0"
description = "Backend API for the drilling costing application"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "bcrypt>=4.1.2,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "psycopg>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "xlrd>=2.0,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "pwdlib[bcrypt]>=0.2,<1",
  "sqlalchemy>=2.0.36,<2.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
# Argon2id password hashing. Kept optional on purpose: argon2-cffi-bindings
# only publishes aarch64 wheels tagged manylinux_2_26/2_28, so it cannot install
# wheels-only inside long-lived proot Debian containers with glibc < 2.26
# (Termux deployments). The default install therefore uses bcrypt, whose
# manylinux2014 (glibc 2.17) wheels cover every platform the backend runs on;
# app/core/security.py prefers Argon2id automatically whenever this extra is
# installed (desktop/cloud) and keeps verifying bcrypt hashes everywhere.
argon2 = [
  "argon2-cffi>=23.1,<26",
]
dev = [
  "httpx>=0.28,<1",
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.pyright]
include = ["app"]
exclude = ["alembic"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests that exercise database or API integration",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
  "app/repositories/entities.py",
  "app/services/entities.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
